# Render Blueprint — UMKM Hub API + PostgreSQL (FREE tier)
# https://render.com/docs/blueprint-spec

databases:
  - name: umkm-hub-db
    databaseName: umkm_hub
    user: umkm
    plan: free

services:
  - type: web
    name: umkm-hub-api
    runtime: node
    plan: free
    rootDir: apps/api
    # Inline command so deploy works even if Blueprint sync skips script overrides.
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: umkm-hub-2b955
      - key: DATABASE_URL
        fromDatabase:
          name: umkm-hub-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://umkm-hub-web.vercel.app,http://localhost:3000
      - key: APP_PUBLIC_URL
        value: https://umkm-hub-web.vercel.app
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
